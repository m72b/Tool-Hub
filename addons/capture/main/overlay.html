<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:">
<title>Select a region</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair;user-select:none;}
#shot{position:fixed;inset:0;width:100%;height:100%;}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.4);}
#box{position:fixed;display:none;outline:1px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);}
#size{position:fixed;display:none;background:#111;color:#fff;font:12px system-ui,sans-serif;padding:2px 6px;border-radius:4px;}
#hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font:13px system-ui,sans-serif;padding:6px 12px;border-radius:6px;}
</style>
</head>
<body>
<img id="shot" alt="">
<div id="dim"></div>
<div id="box"></div>
<div id="size"></div>
<div id="hint">Drag to select an area. Press Esc to cancel.</div>
<script src="overlay.js"></script>
</body>
</html>
